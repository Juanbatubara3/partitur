<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e1a33">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RNHKBP Pelikan">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex">
  <title>Kepengurusan · Admin RNHKBP Pelikan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-active="kepengurusan" data-title="Kepengurusan">
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <div class="page-head">
      <h1>Kepengurusan</h1>
      <p>Nama dan kontak pengurus yang tampil di beranda. Pratinjau di sebelah kanan ikut berubah saat kamu mengetik.</p>
    </div>

    <div class="overlay" id="overlay"><span class="spin"></span></div>

    <div class="split">
      <div id="forms"></div>
      <aside class="card sticky">
        <div class="card-head"><div><h3>Pratinjau</h3><p class="hint">Begini data tersimpan nanti.</p></div></div>
        <ul class="pv" id="preview"></ul>
      </aside>
    </div>

    <div class="savebar" id="savebar">
      <span id="saveState">Belum ada perubahan.</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="btnReload" type="button"><i class="fas fa-rotate"></i> Muat ulang</button>
        <button class="btn btn-sm" id="btnSimpan" type="button"><i class="fas fa-floppy-disk"></i> Simpan semua</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/admin-common.js"></script>
<script>
const { db, esc, toast, confirmBox, requireAuth } = AdminApp;
const $ = (id) => document.getElementById(id);

/* Kunci field (ketua, ketua_kontak, seksi1, ...) harus sama dengan yang dibaca beranda */
const GROUPS = [
  { title: 'Inti pengurus', icon: 'fa-user-tie', rows: [
    { key: 'ketua', role: 'Ketua Naposobulung', def: ['Ricky Sihombing', '0812-3456-7890'] },
    { key: 'sekretaris', role: 'Sekretaris', def: ['Gabriel Marbun', '0812-3456-7891'] },
    { key: 'bendahara', role: 'Bendahara', def: ['Vincen Manurung', '0812-3456-7892'] } ] },
  { title: '7 seksi Naposobulung', icon: 'fa-users', rows: [
    { key: 'seksi1', role: 'Seksi 1', sub: 'Koor & Musik', def: ['Liven Manalu', '0812-3456-7893'] },
    { key: 'seksi2', role: 'Seksi 2', sub: 'Perlengkapan', def: ['Dirga Simarmata', '0812-3456-7894'] },
    { key: 'seksi3', role: 'Seksi 3', sub: 'Konsumsi', def: ['Bella Tampubolon', '0812-3456-7895'] },
    { key: 'seksi4', role: 'Seksi 4', sub: 'Dokumentasi', def: ['Frans Hutagalung', '0812-3456-7896'] },
    { key: 'seksi5', role: 'Seksi 5', sub: 'Kebersihan', def: ['Herland Pardede', '0812-3456-7897'] },
    { key: 'seksi6', role: 'Seksi 6', sub: 'Acara & Kreatif', def: ['Putri Manalu', '0812-3456-7898'] },
    { key: 'seksi7', role: 'Seksi 7', sub: 'Humas', def: ['Samuel Sitanggang', '0812-3456-7899'] } ] },
  { title: 'Parguru & Inang Paniroi', icon: 'fa-chalkboard-user', rows: [
    { key: 'parguru', role: 'Koordinator Parguru Malua', def: ['Gabriel Manullang', '0812-3456-7800'] },
    { key: 'inang', role: 'Inang Paniroi', def: ['Ibu Sorta Simanjuntak', '0812-3456-7810'] } ] }
];
const ALL = GROUPS.flatMap((g) => g.rows);
let dirty = false;

$('forms').innerHTML = GROUPS.map((g) => `
  <div class="card">
    <div class="card-head"><h3><i class="fas ${g.icon}" style="color:var(--blue);margin-right:8px"></i>${esc(g.title)}</h3></div>
    ${g.rows.map((r) => `
      <div class="person-row">
        <div class="role">${esc(r.role)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div>
        <input type="text" class="input" id="${r.key}" placeholder="Nama" aria-label="Nama ${esc(r.role)}" autocomplete="off">
        <input type="text" class="input" id="${r.key}_kontak" placeholder="No. WhatsApp" aria-label="Kontak ${esc(r.role)}" inputmode="tel" autocomplete="off">
      </div>`).join('')}
  </div>`).join('');

function setDirty(v) {
  dirty = v;
  $('savebar').classList.toggle('dirty', v);
  $('saveState').textContent = v ? 'Ada perubahan yang belum disimpan.' : 'Semua perubahan sudah tersimpan.';
}
function updatePreview() {
  $('preview').innerHTML = ALL.map((r) => {
    const nama = $(r.key).value.trim(), kontak = $(r.key + '_kontak').value.trim();
    const label = r.sub ? `${r.role} · ${r.sub}` : r.role;
    return `<li><span class="ava">${esc((nama.charAt(0) || '?').toUpperCase())}</span>
      <div class="t"><b>${nama ? esc(nama) : '<em>Belum diisi</em>'}</b><small>${esc(label)}${kontak ? ' · ' + esc(kontak) : ''}</small></div></li>`;
  }).join('');
}
document.querySelectorAll('#forms input').forEach((i) => i.addEventListener('input', () => { updatePreview(); setDirty(true); }));
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

async function loadData() {
  $('overlay').classList.add('show');
  try {
    const snap = await db.collection("pengurus").doc("kepengurusan").get();
    if (snap.exists) {
      const d = snap.data();
      ALL.forEach((r) => { $(r.key).value = d[r.key] || r.def[0]; $(r.key + '_kontak').value = d[r.key + '_kontak'] || r.def[1]; });
    }
    updatePreview(); setDirty(false);
    $('saveState').textContent = snap.exists ? 'Data terbaru sudah dimuat.' : 'Belum ada data tersimpan. Isi lalu simpan.';
  } catch (err) { console.error(err); toast('Gagal memuat data: ' + err.message, 'error'); }
  $('overlay').classList.remove('show');
}

async function simpanData() {
  const data = { lastUpdated: firebase.firestore.FieldValue.serverTimestamp() };
  ALL.forEach((r) => { data[r.key] = $(r.key).value.trim(); data[r.key + '_kontak'] = $(r.key + '_kontak').value.trim(); });
  const btn = $('btnSimpan'); btn.disabled = true;
  try {
    await db.collection("pengurus").doc("kepengurusan").set(data, { merge: true });
    setDirty(false); toast('Data kepengurusan disimpan.', 'success');
  } catch (err) { console.error(err); toast('Gagal menyimpan: ' + err.message, 'error'); }
  btn.disabled = false;
}
$('btnSimpan').addEventListener('click', simpanData);
$('btnReload').addEventListener('click', async () => {
  if (!dirty || await confirmBox({ title: 'Muat ulang data?', text: 'Perubahan yang belum disimpan akan hilang.', ok: 'Muat ulang', danger: true })) loadData();
});

updatePreview();
requireAuth(loadData);
</script>
<script src="js/pwa-init.js"></script>
</body>
</html>
